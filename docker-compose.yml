services:
  db:
    image: pgvector/pgvector:pg15
    container_name: submittery_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: submittery
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: submittery_redis
    restart: always
    ports:
      - "6385:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
