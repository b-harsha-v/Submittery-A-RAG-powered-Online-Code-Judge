version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg15
    container_name: submittery_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-submittery}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - submittery_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: submittery_redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - submittery_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  compiler:
    build:
      context: .
      dockerfile: Dockerfile.compiler
    container_name: submittery_compiler
    restart: always
    environment:
      - SANDBOX_TEMP_DIR=/tmp/submittery_runs
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/submittery_runs:/tmp/submittery_runs
    networks:
      - submittery_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: submittery_backend
    restart: always
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-submittery}
      - REDIS_URL=redis://redis:6379/0
      - COMPILER_SERVICE_URL=http://compiler:8002/execute
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - submittery_network

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: submittery_worker
    restart: always
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-submittery}
      - REDIS_URL=redis://redis:6379/0
      - COMPILER_SERVICE_URL=http://compiler:8002/execute
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      compiler:
        condition: service_started
    networks:
      - submittery_network

  nginx:
    image: nginx:alpine
    container_name: submittery_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - submittery_network

volumes:
  postgres_data:
    name: submittery_postgres_data
  redis_data:
    name: submittery_redis_data

networks:
  submittery_network:
    name: submittery_network
    driver: bridge
